name: Import obituaries

on:
  schedule:
    - cron: "30 5,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview source without publishing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: import-obituaries
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import notices
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          OBITUARY_IMPORT_SECRET: ${{ secrets.OBITUARY_IMPORT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test -n "$SITE_URL" && test -n "$OBITUARY_IMPORT_SECRET"
          response=$(curl --fail --show-error --silent --max-time 180 --request POST \
            --header "Authorization: Bearer $OBITUARY_IMPORT_SECRET" \
            "$SITE_URL/api/import-obituaries?dryRun=${DRY_RUN:-false}")
          printf '%s\n' "$response"
          printf '%s' "$response" | jq -e '.invalid == 0'
